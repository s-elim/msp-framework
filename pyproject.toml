[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msp"
version = "0.1.0"
description = "Manipulation-Sufficient Perception: perception as sufficiency, not accuracy."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "h5py>=3.9",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
sim  = ["mujoco>=3.1", "trimesh>=4.0"]
log  = ["wandb>=0.16"]
dev  = ["pytest>=8", "pytest-cov>=5", "mypy>=1.8", "ruff>=0.4", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "equation: pins a numbered equation of the formalization",
  "regression: reproduces a defect found in the audited implementation",
  "slow: requires a simulator or GPU",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
python_version = "3.12"
packages = ["msp"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = []

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "h5py.*", "wandb.*", "mujoco.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]
